name: Deploy Inference Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          which python3.13
          python3.13 --version
          python3.13 -m pip --version

      - name: Install dependencies
        run: |
          TMPDIR="$HOME/pip-tmp" python3.13 -m pip install --upgrade pip --no-cache-dir
          TMPDIR="$HOME/pip-tmp" python3.13 -m pip install --no-cache-dir -r requirements.txt

      - name: Restart inference service
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
        run: |
          sudo systemctl restart agribotics-inference

      - name: Verify inference service
        run: |
          sleep 5

          if sudo systemctl is-active --quiet agribotics-inference; then
            echo "Inference service is running."
            sudo systemctl status agribotics-inference --no-pager
          else
            echo "Inference service failed to start."
            echo "----- SERVICE STATUS -----"
            sudo systemctl status agribotics-inference --no-pager || true
            echo "----- SERVICE LOG -----"
            sudo journalctl -u agribotics-inference --no-pager -n 100
            exit 1
          fi
