name: Deploy Inference Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          which python3.13
          python3.13 --version
          python3.13 -m pip --version

      - name: Install dependencies
        run: |
          TMPDIR="$HOME/pip-tmp" python3.13 -m pip install --upgrade pip --no-cache-dir
          TMPDIR="$HOME/pip-tmp" python3.13 -m pip install --no-cache-dir -r requirements.txt

      - name: Stop existing inference service
        run: |
          if [ -f inference.pid ]; then
            PID=$(cat inference.pid)

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping existing inference service (PID: $PID)..."
              kill "$PID"

              for i in {1..10}; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              if kill -0 "$PID" 2>/dev/null; then
                echo "Service did not stop gracefully. Force killing..."
                kill -9 "$PID" 2>/dev/null || true
              fi
            else
              echo "Existing process is not running."
            fi

            rm -f inference.pid
          else
            echo "No existing inference service found."
          fi

      - name: Start inference service
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
        run: |
          nohup python3.13 -u main.py > inference.log 2>&1 &
          echo $! > inference.pid

      - name: Verify service started
        run: |
          sleep 5

          if kill -0 "$(cat inference.pid)" 2>/dev/null; then
            echo "Inference service started successfully."
            echo "PID: $(cat inference.pid)"
            echo "Python: $(python3.13 --version)"
          else
            echo "Inference service failed to start."
            echo "----- inference.log -----"
            cat inference.log
            exit 1
          fi
