name: Deploy Inference Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stop existing inference service
        run: |
          pkill -f "python main.py" || true

      - name: Start inference service
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
        run: |
          nohup python main.py > inference.log 2>&1 &
          echo $! > inference.pid

      - name: Verify service started
        run: |
          sleep 5

          if kill -0 $(cat inference.pid) 2>/dev/null; then
            echo "Inference service started successfully."
          else
            echo "Inference service failed to start."
            cat inference.log
            exit 1
          fi
